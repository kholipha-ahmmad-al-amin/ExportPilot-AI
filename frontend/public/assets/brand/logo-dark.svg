    <line x1="32" y1="12" x2="32" y2="52" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="2,2"/>
    <circle cx="32" cy="32" r="4" fill="#FFFFFF"/>
    <circle cx="48" cy="20" r="3" fill="#10B981"/>
    <circle cx="16" cy="40" r="3" fill="#10B981"/>
  </g>
